spring.application.name=controledepresenca

# 1. Porta exigida pelo Hugging Face Spaces
server.port=7860

# 2. Conexão com o Banco do Aiven (MySQL)
spring.datasource.url=jdbc:mysql://mysql-1f715e5e-jean-8383.d.aivencloud.com:26987/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=SUA_NOVA_SENHA_DO_AIVEN
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Configurações do Hibernate / JPA para MySQL
# Usamos 'update' na nuvem para ele criar as tabelas e NÃO apagar os dados toda vez que reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

# 4. Proteção de Memória e Conexões no Aiven
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# 5. Suas configurações do Jackson e Logs (Mantidas)
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true
logging.level.org.springframework.web=DEBUG
logging.level.com.fasterxml.jackson=TRACE