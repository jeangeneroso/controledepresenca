spring.application.name=controledepresenca
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 1. Deixe apenas UMA linha ddl-auto configurada como 'create-drop' ou 'create'
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# 2. ADICIONE ESTA LINHA OBRIGATORIAMENTE para o Spring Boot moderno rodar o import.sql
spring.jpa.defer-datasource-initialization=true

# Faz o Spring lançar um erro detalhado se encontrar qualquer incompatibilidade no JSON
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true

# Ativa os logs detalhados do Spring MVC para expor falhas de conversão de dados
logging.level.org.springframework.web=DEBUG
logging.level.com.fasterxml.jackson=TRACE

