# ============================================================
# BANCO DE DADOS (TiDB Cloud)
# ============================================================
spring.datasource.url=jdbc:mysql://gateway01.us-east-1.prod.aws.tidbcloud.com:4000/test?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.username=${DB_USERNAME:3NutKNNgzpxkjEB.root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${PORT:8080}

# Força os scripts SQL a executarem DEPOIS que o JPA criar/atualizar as tabelas
spring.jpa.defer-datasource-initialization=true

# Executa o schema.sql/data.sql para aplicar as regras nas tabelas
spring.sql.init.mode=always

# Permite que a aplicação continue subindo mesmo se um comando no SQL falhar
spring.sql.init.continue-on-error=true

# ============================================================
# OTIMIZAÇÃO DE MEMÓRIA E POOL (HikariCP)
# ============================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# ============================================================
# OTIMIZAÇÃO DE CPU E PROCESSAMENTO (Tomcat / Render 0.1 vCPU)
# ============================================================
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=100

# ============================================================
# REDUÇÃO DE LOGS (Economiza CPU e RAM no Render)
# ============================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR

# Compressão HTTP (Reduz uso de banda no Render)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024