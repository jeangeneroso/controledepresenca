# ============================================================
# BANCO DE DADOS (TiDB Cloud / MySQL)
# ============================================================
spring.datasource.url=jdbc:mysql://gateway01.us-east-1.prod.aws.tidbcloud.com:4000/test?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ============================================================
# OTIMIZAÇÃO DE MEMÓRIA E POOL (HikariCP)
# ============================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# ============================================================
# OTIMIZAÇÃO DE CPU E PROCESSAMENTO (Tomcat / Render 0.1 vCPU)
# ============================================================
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=100

# Compressão HTTP (Reduz uso de banda no Render)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024